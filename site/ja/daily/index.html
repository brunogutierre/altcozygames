<body>
<main class="wrap">
<section class="card">
  <div class="app-id"><img src="/icon.png" alt="" width="52" height="52"><span class="wordmark"><small>Advanced</small> <span>Sudoku</span></span></div>
  <h1 id="title">デイリーチャレンジ</h1>
  <p class="intro" id="intro">毎日、みんなに同じ問題。</p>
  <div class="actions">
    <a class="button" id="open" hidden>アプリで開く</a>
    <a class="badge" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku&amp;referrer=utm_source%3Ddaily%26utm_medium%3Dlink"><img src="/badges/ja.png" alt="Google Play で手に入れよう" height="64"></a>
  </div>
  <p class="note">無料・広告なし・アカウント不要。</p>
</section>
</main>
<footer class="wrap site-footer"><span>お問い合わせ: <a href="mailto:altcozygames@gmail.com">altcozygames@gmail.com</a></span><a href="/">制作：Alt Cozy Games</a></footer>
<script>
const D = {"t":{"intro":"友だちが {{date}} のデイリー数独を解きました。毎日みんなに同じ問題が出ます。今日の問題もどうぞ。","invalid":"このリンクは不完全です。今日のデイリー数独はアプリで遊べます。","ogTitle":"{{title}} · {{date}}","ogDescription":"毎日、みんなに同じ問題。","title":"デイリーチャレンジ","open":"アプリで開く"},"lang":"ja","play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const raw = decodeURIComponent(location.pathname.split('/daily/')[1] || '').replace(/\/+$/, '');
const valid = /^\d{4}-\d{2}-\d{2}$/.test(raw) && !Number.isNaN(Date.parse(raw + 'T00:00:00Z'));
const fill = (text, values) => text.replace(/{{\s*(\w+)\s*}}/g, (_, k) => values[k] ?? '');
let referrer = 'utm_source=daily&utm_medium=link';
if (valid) {
  const date = new Intl.DateTimeFormat(D.lang, { day: 'numeric', month: 'long', timeZone: 'UTC' }).format(new Date(raw + 'T00:00:00Z'));
  $('title').textContent = fill(D.t.ogTitle, { title: D.t.title, date });
  $('intro').textContent = fill(D.t.intro, { date });
  referrer += '&daily=' + raw;
} else if (raw) {
  $('intro').textContent = D.t.invalid;
}
const play = D.play + '&referrer=' + encodeURIComponent(referrer);
$('install').href = play;
if (/Android/i.test(navigator.userAgent)) {
  const open = $('open');
  open.href = 'intent://open/daily#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
  open.hidden = false;
}
</script>
</body>
</html>
