<!doctype html><html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Advanced Sudoku · Sudoku challenge</title>
<meta name="description" content="A friend solved this sudoku. Can you beat their time?">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Advanced Sudoku">
<meta property="og:title" content="Sudoku challenge · Advanced Sudoku">
<meta property="og:description" content="A friend solved this sudoku. Can you beat their time?">
<meta property="og:image" content="https://brunogutierre.github.io/altcozygames/advanced-sudoku/icon.png">
<meta name="robots" content="noindex">
<style>
:root{--bg:#f6efe3;--card:#fffaf2;--text:#30271f;--muted:#625344;--accent:#91452c;--on-accent:#fff8ef;--line:#e2d5c1;color-scheme:light dark}
@media (prefers-color-scheme:dark){:root{--bg:#1d1814;--card:#29221c;--text:#f1e7d8;--muted:#c5b4a0;--accent:#e8a17e;--on-accent:#24160e;--line:#3a3029}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--bg);color:var(--text);font:16px/1.55 system-ui,sans-serif}
main{width:100%;max-width:420px;padding:28px 24px;border:1px solid var(--line);border-radius:18px;background:var(--card);box-shadow:0 12px 32px rgb(46 38 56/.1);text-align:center}
.brand{display:flex;align-items:center;justify-content:center;gap:10px;margin:0 0 18px;color:var(--muted);font-size:14px}
.brand img{width:40px;height:40px;border-radius:10px}
h1{margin:0 0 6px;font:500 1.75rem/1.2 Georgia,serif;color:var(--accent)}
.intro{margin:0 0 18px;color:var(--muted)}
.challenge{margin:0 0 20px;padding:14px;border:1.5px dashed var(--line);border-radius:12px}
.kind{margin:0;font-weight:600}
.time{margin:4px 0 0;font:500 2.25rem/1.1 Georgia,serif;font-variant-numeric:tabular-nums}
.label{margin:0;color:var(--muted);font-size:13px}
.actions{display:grid;gap:10px}
a.button,button{display:block;width:100%;padding:13px 16px;border:0;border-radius:12px;font:600 1rem/1.2 system-ui,sans-serif;text-decoration:none;cursor:pointer}
.primary{background:var(--accent);color:var(--on-accent)}
.secondary{background:transparent;color:var(--accent);box-shadow:inset 0 0 0 1.5px var(--accent)}
.code{margin:22px 0 0;font-size:14px;color:var(--muted)}
.code strong{display:inline-block;margin:6px 0;padding:6px 12px;border-radius:8px;background:var(--bg);color:var(--text);font:600 1.125rem/1.3 ui-monospace,monospace;letter-spacing:.04em;user-select:all}
.copy{display:inline;width:auto;margin-left:6px;padding:6px 10px;background:transparent;color:var(--accent);font-size:14px}
.note{margin:18px 0 0;color:var(--muted);font-size:13px}
[hidden]{display:none!important}
</style></head><body>
<main>
  <p class="brand"><img src="../icon.png" alt="" width="40" height="40">Advanced Sudoku</p>
  <h1 id="title">Sudoku challenge</h1>
  <p class="intro" id="intro"></p>
  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label" id="toBeat"></p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button primary" id="open" hidden></a>
    <a class="button secondary" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku"></a>
  </div>
  <p class="code" id="codeBox" hidden><span id="codeLabel"></span><br><strong id="code"></strong><button class="copy" id="copy" type="button"></button></p>
  <p class="note" id="note"></p>
</main>
<script>
const T = {"en":{"title":"Sudoku challenge","intro":"A friend solved this sudoku and wants to see you try.","toBeat":"Time to beat","open":"Open in the app","install":"Get it on Google Play","code":"Or enter this code in Advanced Sudoku, under Duel:","copy":"Copy code","copied":"Copied","invalid":"This challenge link is incomplete. Ask your friend to send it again.","note":"Free, no ads, no account.","variant":{"classic":"Classic","diagonal":"Diagonal","antiKnight":"Anti-Knight","killer":"Killer","evenOdd":"Even/Odd","hyper":"Hyper","consecutive":"Consecutive","jigsaw":"Jigsaw","thermo":"Thermo","arrow":"Arrow"},"difficulty":{"easy":"Easy","medium":"Medium","hard":"Hard","insane":"Insane"},"duelTitle":"Duel"},"pt-BR":{"title":"Desafio de sudoku","intro":"Um amigo resolveu este sudoku e quer ver você tentar.","toBeat":"Tempo a bater","open":"Abrir no app","install":"Baixar no Google Play","code":"Ou digite este código no Advanced Sudoku, em Duelo:","copy":"Copiar código","copied":"Copiado","invalid":"Este link de desafio está incompleto. Peça para o seu amigo enviar de novo.","note":"Grátis, sem anúncios, sem conta.","variant":{"classic":"Clássico","diagonal":"Diagonal","antiKnight":"Anti-Cavalo","killer":"Killer","evenOdd":"Par/Ímpar","hyper":"Hyper","consecutive":"Consecutivo","jigsaw":"Jigsaw","thermo":"Termômetro","arrow":"Flecha"},"difficulty":{"easy":"Fácil","medium":"Médio","hard":"Difícil","insane":"Insano"},"duelTitle":"Duelo"},"es":{"title":"Desafío de sudoku","intro":"Un amigo resolvió este sudoku y quiere verte intentarlo.","toBeat":"Tiempo a batir","open":"Abrir en la app","install":"Disponible en Google Play","code":"O escribe este código en Advanced Sudoku, en Duelo:","copy":"Copiar código","copied":"Copiado","invalid":"Este enlace de desafío está incompleto. Pide a tu amigo que lo envíe de nuevo.","note":"Gratis, sin anuncios, sin cuenta.","variant":{"classic":"Clásico","diagonal":"Diagonal","antiKnight":"Anticaballo","killer":"Killer","evenOdd":"Par/Impar","hyper":"Hyper","consecutive":"Consecutivo","jigsaw":"Jigsaw","thermo":"Termómetro","arrow":"Flecha"},"difficulty":{"easy":"Fácil","medium":"Medio","hard":"Difícil","insane":"Extremo"},"duelTitle":"Duelo"},"fr":{"title":"Défi sudoku","intro":"Un ami a résolu ce sudoku et veut vous voir essayer.","toBeat":"Temps à battre","open":"Ouvrir dans l’app","install":"Disponible sur Google Play","code":"Ou saisissez ce code dans Advanced Sudoku, rubrique Duel :","copy":"Copier le code","copied":"Copié","invalid":"Ce lien de défi est incomplet. Demandez à votre ami de le renvoyer.","note":"Gratuit, sans publicité, sans compte.","variant":{"classic":"Classique","diagonal":"Diagonal","antiKnight":"Anti-cavalier","killer":"Killer","evenOdd":"Pair/Impair","hyper":"Hyper","consecutive":"Consécutif","jigsaw":"Jigsaw","thermo":"Thermo","arrow":"Flèche"},"difficulty":{"easy":"Facile","medium":"Moyen","hard":"Difficile","insane":"Extrême"},"duelTitle":"Duel"},"de":{"title":"Sudoku-Duell","intro":"Ein Freund hat dieses Sudoku gelöst und will sehen, wie du dich schlägst.","toBeat":"Zu schlagende Zeit","open":"In der App öffnen","install":"Jetzt bei Google Play","code":"Oder gib diesen Code in Advanced Sudoku unter Duell ein:","copy":"Code kopieren","copied":"Kopiert","invalid":"Dieser Duell-Link ist unvollständig. Bitte deinen Freund, ihn noch einmal zu senden.","note":"Kostenlos, ohne Werbung, ohne Konto.","variant":{"classic":"Klassisch","diagonal":"Diagonal","antiKnight":"Anti-Springer","killer":"Killer","evenOdd":"Gerade/Ungerade","hyper":"Hyper","consecutive":"Konsekutiv","jigsaw":"Jigsaw","thermo":"Thermo","arrow":"Pfeil"},"difficulty":{"easy":"Leicht","medium":"Mittel","hard":"Schwer","insane":"Extrem"},"duelTitle":"Duell"},"pl":{"title":"Wyzwanie sudoku","intro":"Znajomy rozwiązał to sudoku i chce zobaczyć, jak ci pójdzie.","toBeat":"Czas do pobicia","open":"Otwórz w aplikacji","install":"Pobierz z Google Play","code":"Albo wpisz ten kod w Advanced Sudoku, w sekcji Pojedynek:","copy":"Kopiuj kod","copied":"Skopiowano","invalid":"Ten link do wyzwania jest niepełny. Poproś znajomego, żeby wysłał go jeszcze raz.","note":"Za darmo, bez reklam, bez konta.","variant":{"classic":"Klasyczne","diagonal":"Przekątne","antiKnight":"Antyskoczek","killer":"Killer","evenOdd":"Parzyste/Nieparzyste","hyper":"Hyper","consecutive":"Kolejne","jigsaw":"Jigsaw","thermo":"Termometr","arrow":"Strzałka"},"difficulty":{"easy":"Łatwy","medium":"Średni","hard":"Trudny","insane":"Szalony"},"duelTitle":"Pojedynek"},"ru":{"title":"Вызов в судоку","intro":"Друг решил это судоку и хочет посмотреть, как справитесь вы.","toBeat":"Время, которое нужно побить","open":"Открыть в приложении","install":"Скачать в Google Play","code":"Или введите этот код в Advanced Sudoku, в разделе «Дуэль»:","copy":"Скопировать код","copied":"Скопировано","invalid":"Эта ссылка на вызов неполная. Попросите друга отправить её ещё раз.","note":"Бесплатно, без рекламы, без аккаунта.","variant":{"classic":"Классика","diagonal":"Диагональное","antiKnight":"Антиконь","killer":"Киллер","evenOdd":"Чёт/нечет","hyper":"Гипер","consecutive":"Последовательное","jigsaw":"Пазл","thermo":"Термометр","arrow":"Стрелка"},"difficulty":{"easy":"Лёгкий","medium":"Средний","hard":"Сложный","insane":"Безумный"},"duelTitle":"Дуэль"},"ja":{"title":"数独の挑戦状","intro":"友だちがこの数独を解きました。あなたも挑戦してみませんか。","toBeat":"目標タイム","open":"アプリで開く","install":"Google Play で入手","code":"または Advanced Sudoku の「対戦」でこのコードを入力：","copy":"コードをコピー","copied":"コピーしました","invalid":"この挑戦リンクは不完全です。もう一度送ってもらってください。","note":"無料・広告なし・アカウント不要。","variant":{"classic":"クラシック","diagonal":"対角線","antiKnight":"アンチナイト","killer":"キラー","evenOdd":"偶数・奇数","hyper":"ハイパー","consecutive":"連続","jigsaw":"ジグソー","thermo":"サーモ","arrow":"矢印"},"difficulty":{"easy":"かんたん","medium":"ふつう","hard":"むずかしい","insane":"超難問"},"duelTitle":"対戦"},"ko":{"title":"스도쿠 도전장","intro":"친구가 이 스도쿠를 풀었어요. 도전해 보세요!","toBeat":"이겨야 할 기록","open":"앱에서 열기","install":"Google Play에서 받기","code":"또는 Advanced Sudoku의 대결에서 이 코드를 입력하세요:","copy":"코드 복사","copied":"복사됨","invalid":"도전 링크가 완전하지 않아요. 친구에게 다시 보내 달라고 하세요.","note":"무료, 광고 없음, 계정 필요 없음.","variant":{"classic":"클래식","diagonal":"대각선","antiKnight":"안티나이트","killer":"킬러","evenOdd":"짝수/홀수","hyper":"하이퍼","consecutive":"연속","jigsaw":"직소","thermo":"온도계","arrow":"화살표"},"difficulty":{"easy":"쉬움","medium":"보통","hard":"어려움","insane":"극악"},"duelTitle":"대결"},"zh-Hans":{"title":"数独挑战","intro":"朋友解完了这道数独，想看看你的表现。","toBeat":"要打破的时间","open":"在应用中打开","install":"在 Google Play 下载","code":"或在 Advanced Sudoku 的“对战”中输入此代码：","copy":"复制代码","copied":"已复制","invalid":"这个挑战链接不完整。请让朋友重新发送。","note":"免费、无广告、无需账号。","variant":{"classic":"经典","diagonal":"对角线","antiKnight":"无马步","killer":"杀手","evenOdd":"奇偶","hyper":"超级","consecutive":"连续","jigsaw":"锯齿","thermo":"温度计","arrow":"箭头"},"difficulty":{"easy":"简单","medium":"中等","hard":"困难","insane":"地狱"},"duelTitle":"对战"}};
const LETTERS = 'CDAKEHNJTW';
const VARIANTS = ['classic','diagonal','antiKnight','killer','evenOdd','hyper','consecutive','jigsaw','thermo','arrow'];
const TIERS = ['easy','medium','hard','insane'];
const PLAY = "https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku";
const pick = () => {
  for (const want of navigator.languages || [navigator.language]) {
    const w = String(want).toLowerCase();
    const exact = Object.keys(T).find((l) => l.toLowerCase() === w);
    if (exact) return exact;
    if (w.startsWith('zh')) return 'zh-Hans';
    if (w.startsWith('pt')) return 'pt-BR';
    const base = Object.keys(T).find((l) => l.split('-')[0] === w.split('-')[0]);
    if (base) return base;
  }
  return 'en';
};
const lang = pick();
const t = T[lang];
document.documentElement.lang = lang;
const $ = (id) => document.getElementById(id);
const raw = new URLSearchParams(location.search).get('c') || location.hash.slice(1);
const m = new RegExp('^([' + LETTERS + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec((raw || '').trim());
document.title = t.title + ' · Advanced Sudoku';
$('title').textContent = t.title;
$('install').textContent = t.install;
$('note').textContent = t.note;
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const variant = VARIANTS[LETTERS.indexOf(m[1].toUpperCase())];
  const seconds = parseInt(m[4], 36);
  const time = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('intro').textContent = t.intro;
  $('kind').textContent = t.variant[variant] + ' · ' + t.difficulty[TIERS[Number(m[2]) - 1]];
  $('toBeat').textContent = t.toBeat;
  $('time').textContent = time;
  $('challenge').hidden = false;
  $('codeLabel').textContent = t.code;
  $('code').textContent = code;
  $('copy').textContent = t.copy;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = t.copied), () => undefined);
  });
  // Android: open the app on the duel (or the store when it is not installed).
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.textContent = t.open;
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=com.altcozygames.advancedsudoku;S.browser_fallback_url=' + encodeURIComponent(PLAY) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = t.invalid;
}
</script>
</body></html>
