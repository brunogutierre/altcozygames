<head>

<meta property="og:description" content="Um amigo resolveu este sudoku e quer ver você tentar.">
<meta property="og:url" content="https://altcozygames.com/pt/d">
<meta property="og:image" content="https://altcozygames.com/og/sudoku-pt.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="theme-color" content="#211d19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<main class="wrap">
<section class="card">
  <div class="app-id"><img src="/icon.png" alt="" width="52" height="52"><span class="wordmark"><small>Advanced</small> <span>Sudoku</span></span></div>
  <h1>Desafio de sudoku</h1>
  <p class="intro" id="intro">Um amigo resolveu este sudoku e quer ver você tentar.</p>
  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label">Tempo a bater</p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button" id="open" hidden>Abrir no app</a>
    <a class="badge" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku&amp;referrer=utm_source%3Dduel%26utm_medium%3Dlink"><img src="/badges/pt-BR.png" alt="Disponível no Google Play" height="64"></a>
  </div>
  <p class="code" id="codeBox" hidden>Ou digite este código no Advanced Sudoku, em Duelo:<br><strong id="code"></strong><button class="copy" id="copy" type="button">Copiar código</button></p>
  <p class="note">Grátis, sem anúncios, sem conta.</p>
</section>
</main>
<footer class="wrap site-footer"><span>Contato: <a href="mailto:altcozygames@gmail.com">altcozygames@gmail.com</a></span><a href="/">Feito pela Alt Cozy Games</a></footer>
<script>
const D = {"t":{"title":"Desafio de sudoku","intro":"Um amigo resolveu este sudoku e quer ver você tentar.","toBeat":"Tempo a bater","code":"Ou digite este código no Advanced Sudoku, em Duelo:","copy":"Copiar código","copied":"Copiado","invalid":"Este link de desafio está incompleto. Peça para o seu amigo enviar de novo.","ogTitle":"Desafio de sudoku · {{kind}}","ogDescription":"Um amigo resolveu em {{time}}. Consegue bater?","open":"Abrir no app"},"names":{"variant":{"classic":"Clássico","diagonal":"Diagonal","antiKnight":"Anti-Cavalo","killer":"Killer","evenOdd":"Par/Ímpar","hyper":"Hyper","consecutive":"Consecutivo","jigsaw":"Jigsaw","thermo":"Termômetro","arrow":"Flecha"},"difficulty":{"easy":"Fácil","medium":"Médio","hard":"Difícil","insane":"Insano"}},"letters":"CDAKEHNJTW","variants":["classic","diagonal","antiKnight","killer","evenOdd","hyper","consecutive","jigsaw","thermo","arrow"],"tiers":["easy","medium","hard","insane"],"play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const fromPath = decodeURIComponent(location.pathname.split('/d/')[1] || '').replace(/\/+$/, '');
const raw = (fromPath || new URLSearchParams(location.search).get('c') || '').trim();
const m = new RegExp('^([' + D.letters + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec(raw);
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const seconds = parseInt(m[4], 36);
  $('kind').textContent = D.names.variant[D.variants[D.letters.indexOf(m[1].toUpperCase())]] + ' · ' + D.names.difficulty[D.tiers[Number(m[2]) - 1]];
  $('time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('challenge').hidden = false;
  $('code').textContent = code;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = D.t.copied), () => undefined);
  });
  // The Play link carries the code: the app opens this duel on its first launch.
  const play = D.play + '&referrer=' + encodeURIComponent('utm_source=duel&utm_medium=link&duel=' + code);
  $('install').href = play;
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = D.t.invalid;
}
</script>
</body>
</html>
