<body>
<main class="wrap">
<section class="card">
  <div class="app-id"><img src="/icon.png" alt="" width="52" height="52"><span class="wordmark"><small>Advanced</small> <span>Sudoku</span></span></div>
  <h1>Défi sudoku</h1>
  <p class="intro" id="intro">Un ami a résolu ce sudoku et veut vous voir essayer.</p>
  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label">Temps à battre</p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button" id="open" hidden>Ouvrir dans l’app</a>
    <a class="badge" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku&amp;referrer=utm_source%3Dduel%26utm_medium%3Dlink"><img src="/badges/fr.png" alt="Disponible sur Google Play" height="64"></a>
  </div>
  <p class="code" id="codeBox" hidden>Ou saisissez ce code dans Advanced Sudoku, rubrique Duel :<br><strong id="code"></strong><button class="copy" id="copy" type="button">Copier le code</button></p>
  <p class="note">Gratuit, sans publicité, sans compte.</p>
</section>
</main>
<footer class="wrap site-footer"><span>Contact: <a href="mailto:altcozygames@gmail.com">altcozygames@gmail.com</a></span><a href="/">Créé par Alt Cozy Games</a></footer>
<script>
const D = {"t":{"title":"Défi sudoku","intro":"Un ami a résolu ce sudoku et veut vous voir essayer.","toBeat":"Temps à battre","code":"Ou saisissez ce code dans Advanced Sudoku, rubrique Duel :","copy":"Copier le code","copied":"Copié","invalid":"Ce lien de défi est incomplet. Demandez à votre ami de le renvoyer.","ogTitle":"Défi sudoku · {{kind}}","ogDescription":"Un ami l’a résolu en {{time}}. Saurez-vous faire mieux ?","open":"Ouvrir dans l’app"},"names":{"variant":{"classic":"Classique","diagonal":"Diagonal","antiKnight":"Anti-cavalier","killer":"Killer","evenOdd":"Pair/Impair","hyper":"Hyper","consecutive":"Consécutif","jigsaw":"Jigsaw","thermo":"Thermo","arrow":"Flèche"},"difficulty":{"easy":"Facile","medium":"Moyen","hard":"Difficile","insane":"Extrême"}},"letters":"CDAKEHNJTW","variants":["classic","diagonal","antiKnight","killer","evenOdd","hyper","consecutive","jigsaw","thermo","arrow"],"tiers":["easy","medium","hard","insane"],"play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const fromPath = decodeURIComponent(location.pathname.split('/d/')[1] || '').replace(/\/+$/, '');
const raw = (fromPath || new URLSearchParams(location.search).get('c') || '').trim();
const m = new RegExp('^([' + D.letters + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec(raw);
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const seconds = parseInt(m[4], 36);
  $('kind').textContent = D.names.variant[D.variants[D.letters.indexOf(m[1].toUpperCase())]] + ' · ' + D.names.difficulty[D.tiers[Number(m[2]) - 1]];
  $('time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('challenge').hidden = false;
  $('code').textContent = code;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = D.t.copied), () => undefined);
  });
  // The Play link carries the code: the app opens this duel on its first launch.
  const play = D.play + '&referrer=' + encodeURIComponent('utm_source=duel&utm_medium=link&duel=' + code);
  $('install').href = play;
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = D.t.invalid;
}
</script>
</body>
</html>
