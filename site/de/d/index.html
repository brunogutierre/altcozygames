<meta property="og:title" content="Sudoku-Duell · Advanced Sudoku">

<meta property="og:url" content="https://altcozygames.com/de/d">
<meta property="og:image" content="https://altcozygames.com/og/sudoku-de.jpg">

<meta name="theme-color" content="#211d19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>

</head>
<body>
<main class="wrap">
<section class="card">
  <div class="app-id"><img src="/icon.png" alt="" width="52" height="52"><span class="wordmark"><small>Advanced</small> <span>Sudoku</span></span></div>
  <h1>Sudoku-Duell</h1>
  <p class="intro" id="intro">Ein Freund hat dieses Sudoku gelöst und will sehen, wie du dich schlägst.</p>
  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label">Zu schlagende Zeit</p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button" id="open" hidden>In der App öffnen</a>
    <a class="badge" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku&amp;referrer=utm_source%3Dduel%26utm_medium%3Dlink"><img src="/badges/de.png" alt="Jetzt bei Google Play" height="64"></a>
  </div>
  <p class="code" id="codeBox" hidden>Oder gib diesen Code in Advanced Sudoku unter Duell ein:<br><strong id="code"></strong><button class="copy" id="copy" type="button">Code kopieren</button></p>
  <p class="note">Kostenlos, ohne Werbung, ohne Konto.</p>
</section>
</main>
<footer class="wrap site-footer"><span>Kontakt: <a href="mailto:altcozygames@gmail.com">altcozygames@gmail.com</a></span><a href="/">Von Alt Cozy Games</a></footer>
<script>
const D = {"t":{"title":"Sudoku-Duell","intro":"Ein Freund hat dieses Sudoku gelöst und will sehen, wie du dich schlägst.","toBeat":"Zu schlagende Zeit","code":"Oder gib diesen Code in Advanced Sudoku unter Duell ein:","copy":"Code kopieren","copied":"Kopiert","invalid":"Dieser Duell-Link ist unvollständig. Bitte deinen Freund, ihn noch einmal zu senden.","ogTitle":"Sudoku-Duell · {{kind}}","ogDescription":"Ein Freund hat es in {{time}} gelöst. Schaffst du es schneller?","open":"In der App öffnen"},"names":{"variant":{"classic":"Klassisch","diagonal":"Diagonal","antiKnight":"Anti-Springer","killer":"Killer","evenOdd":"Gerade/Ungerade","hyper":"Hyper","consecutive":"Konsekutiv","jigsaw":"Jigsaw","thermo":"Thermo","arrow":"Pfeil"},"difficulty":{"easy":"Leicht","medium":"Mittel","hard":"Schwer","insane":"Extrem"}},"letters":"CDAKEHNJTW","variants":["classic","diagonal","antiKnight","killer","evenOdd","hyper","consecutive","jigsaw","thermo","arrow"],"tiers":["easy","medium","hard","insane"],"play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const fromPath = decodeURIComponent(location.pathname.split('/d/')[1] || '').replace(/\/+$/, '');
const raw = (fromPath || new URLSearchParams(location.search).get('c') || '').trim();
const m = new RegExp('^([' + D.letters + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec(raw);
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const seconds = parseInt(m[4], 36);
  $('kind').textContent = D.names.variant[D.variants[D.letters.indexOf(m[1].toUpperCase())]] + ' · ' + D.names.difficulty[D.tiers[Number(m[2]) - 1]];
  $('time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('challenge').hidden = false;
  $('code').textContent = code;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = D.t.copied), () => undefined);
  });
  // The Play link carries the code: the app opens this duel on its first launch.
  const play = D.play + '&referrer=' + encodeURIComponent('utm_source=duel&utm_medium=link&duel=' + code);
  $('install').href = play;
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = D.t.invalid;
}
</script>
</body>
</html>
