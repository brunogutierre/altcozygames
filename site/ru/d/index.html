  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label">Время, которое нужно побить</p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button" id="open" hidden>Открыть в приложении</a>

  </div>

<script>
const D = {"t":{"title":"Вызов в судоку","intro":"Друг решил это судоку и хочет посмотреть, как справитесь вы.","toBeat":"Время, которое нужно побить","code":"Или введите этот код в Advanced Sudoku, в разделе «Дуэль»:","copy":"Скопировать код","copied":"Скопировано","invalid":"Эта ссылка на вызов неполная. Попросите друга отправить её ещё раз.","ogTitle":"Вызов в судоку · {{kind}}","ogDescription":"Друг решил его за {{time}}. Сможете быстрее?","open":"Открыть в приложении"},"names":{"variant":{"classic":"Классика","diagonal":"Диагональное","antiKnight":"Антиконь","killer":"Киллер","evenOdd":"Чёт/нечет","hyper":"Гипер","consecutive":"Последовательное","jigsaw":"Пазл","thermo":"Термометр","arrow":"Стрелка"},"difficulty":{"easy":"Лёгкий","medium":"Средний","hard":"Сложный","insane":"Безумный"}},"letters":"CDAKEHNJTW","variants":["classic","diagonal","antiKnight","killer","evenOdd","hyper","consecutive","jigsaw","thermo","arrow"],"tiers":["easy","medium","hard","insane"],"play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const fromPath = decodeURIComponent(location.pathname.split('/d/')[1] || '').replace(/\/+$/, '');
const raw = (fromPath || new URLSearchParams(location.search).get('c') || '').trim();
const m = new RegExp('^([' + D.letters + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec(raw);
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const seconds = parseInt(m[4], 36);
  $('kind').textContent = D.names.variant[D.variants[D.letters.indexOf(m[1].toUpperCase())]] + ' · ' + D.names.difficulty[D.tiers[Number(m[2]) - 1]];
  $('time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('challenge').hidden = false;
  $('code').textContent = code;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = D.t.copied), () => undefined);
  });
  // The Play link carries the code: the app opens this duel on its first launch.
  const play = D.play + '&referrer=' + encodeURIComponent('utm_source=duel&utm_medium=link&duel=' + code);
  $('install').href = play;
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = D.t.invalid;
}
</script>
