<head>

<meta name="description" content="Znajomy rozwiązał to sudoku i chce zobaczyć, jak ci pójdzie.">

<meta property="og:type" content="website">
<meta property="og:site_name" content="Advanced Sudoku">
<meta property="og:title" content="Wyzwanie sudoku · Advanced Sudoku">
<meta property="og:description" content="Znajomy rozwiązał to sudoku i chce zobaczyć, jak ci pójdzie.">
<meta property="og:url" content="https://altcozygames.com/pl/d">
<meta property="og:image" content="https://altcozygames.com/og/sudoku-pl.jpg">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">

<meta name="theme-color" content="#211d19" media="(prefers-color-scheme: dark)">
<link rel="icon" href="/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="/icon.png">
<link rel="preload" href="/fonts/fraunces-latin-full-normal.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="/style.css?v=9402c6bf">
</head>
<body>
<main class="wrap">
<section class="card">
  <div class="app-id"><img src="/icon.png" alt="" width="52" height="52"><span class="wordmark"><small>Advanced</small> <span>Sudoku</span></span></div>
  <h1>Wyzwanie sudoku</h1>
  <p class="intro" id="intro">Znajomy rozwiązał to sudoku i chce zobaczyć, jak ci pójdzie.</p>
  <div class="challenge" id="challenge" hidden>
    <p class="kind" id="kind"></p>
    <p class="label">Czas do pobicia</p>
    <p class="time" id="time"></p>
  </div>
  <div class="actions">
    <a class="button" id="open" hidden>Otwórz w aplikacji</a>
    <a class="badge" id="install" href="https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku&amp;referrer=utm_source%3Dduel%26utm_medium%3Dlink"><img src="/badges/pl.png" alt="Pobierz z Google Play" height="64"></a>
  </div>
  <p class="code" id="codeBox" hidden>Albo wpisz ten kod w Advanced Sudoku, w sekcji Pojedynek:<br><strong id="code"></strong><button class="copy" id="copy" type="button">Kopiuj kod</button></p>
  <p class="note">Za darmo, bez reklam, bez konta.</p>
</section>
</main>
<footer class="wrap site-footer"><span>Kontakt: <a href="mailto:altcozygames@gmail.com">altcozygames@gmail.com</a></span><a href="/">Stworzone przez Alt Cozy Games</a></footer>
<script>
const D = {"t":{"title":"Wyzwanie sudoku","intro":"Znajomy rozwiązał to sudoku i chce zobaczyć, jak ci pójdzie.","toBeat":"Czas do pobicia","code":"Albo wpisz ten kod w Advanced Sudoku, w sekcji Pojedynek:","copy":"Kopiuj kod","copied":"Skopiowano","invalid":"Ten link do wyzwania jest niepełny. Poproś znajomego, żeby wysłał go jeszcze raz.","ogTitle":"Wyzwanie sudoku · {{kind}}","ogDescription":"Znajomy rozwiązał je w {{time}}. Dasz radę szybciej?","open":"Otwórz w aplikacji"},"names":{"variant":{"classic":"Klasyczne","diagonal":"Przekątne","antiKnight":"Antyskoczek","killer":"Killer","evenOdd":"Parzyste/Nieparzyste","hyper":"Hyper","consecutive":"Kolejne","jigsaw":"Jigsaw","thermo":"Termometr","arrow":"Strzałka"},"difficulty":{"easy":"Łatwy","medium":"Średni","hard":"Trudny","insane":"Szalony"}},"letters":"CDAKEHNJTW","variants":["classic","diagonal","antiKnight","killer","evenOdd","hyper","consecutive","jigsaw","thermo","arrow"],"tiers":["easy","medium","hard","insane"],"play":"https://play.google.com/store/apps/details?id=com.altcozygames.advancedsudoku","pkg":"com.altcozygames.advancedsudoku"};
const $ = (id) => document.getElementById(id);
const fromPath = decodeURIComponent(location.pathname.split('/d/')[1] || '').replace(/\/+$/, '');
const raw = (fromPath || new URLSearchParams(location.search).get('c') || '').trim();
const m = new RegExp('^([' + D.letters + '])([1-4])-([a-z0-9]{1,16})-([a-z0-9]{1,6})$', 'i').exec(raw);
if (m) {
  const code = m[1].toUpperCase() + m[2] + '-' + m[3].toLowerCase() + '-' + m[4].toLowerCase();
  const seconds = parseInt(m[4], 36);
  $('kind').textContent = D.names.variant[D.variants[D.letters.indexOf(m[1].toUpperCase())]] + ' · ' + D.names.difficulty[D.tiers[Number(m[2]) - 1]];
  $('time').textContent = Math.floor(seconds / 60) + ':' + String(seconds % 60).padStart(2, '0');
  $('challenge').hidden = false;
  $('code').textContent = code;
  $('codeBox').hidden = false;
  $('copy').addEventListener('click', () => {
    navigator.clipboard?.writeText(code).then(() => ($('copy').textContent = D.t.copied), () => undefined);
  });
  // The Play link carries the code: the app opens this duel on its first launch.
  const play = D.play + '&referrer=' + encodeURIComponent('utm_source=duel&utm_medium=link&duel=' + code);
  $('install').href = play;
  if (/Android/i.test(navigator.userAgent)) {
    const open = $('open');
    open.href = 'intent://duel/' + code + '#Intent;scheme=advsudoku;package=' + D.pkg + ';S.browser_fallback_url=' + encodeURIComponent(play) + ';end';
    open.hidden = false;
  }
} else {
  $('intro').textContent = D.t.invalid;
}
</script>
</body>
</html>
